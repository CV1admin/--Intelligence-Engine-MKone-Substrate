name: Quantum simulator verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: TypeScript and production build
        run: npm run build
      - name: Quantum simulator invariants
        run: npm test
